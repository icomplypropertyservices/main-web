headersOrigin = "config"
redirectsOrigin = "config"

[build]
edge_functions = "/workspace/main-web/netlify/edge-functions"
publish = "/workspace/main-web/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "php website/bin/static-export.php --keyword-towns=priority && php website/bin/check-static-export.php"
ignore = "false"

[build.environment]
PHP_VERSION = "8.3"
SITE_URL = "https://icomplypropertyservices.co.uk"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]

[[plugins]]
origin = "config"
package = "./netlify/plugins/lock-sitemap"

