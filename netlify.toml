# Live index used /sitemaps/sitemap-1.xml … sitemap-6.xml plus nested
# /products/sitemap.xml and /shop/sitemap.xml. Those files 404. Send them
# at the one sitemap this site publishes. Do not touch /shop or /products hubs.
[[redirects]]
  from = "/sitemaps/*"
  to = "/sitemap.xml"
  status = 301
  force = true

