# iComply main-web — Netlify (PHP pre-render → static HTML)
#
# Netlify does NOT execute PHP at request time. Publishing raw `website/`
# served `.php` as source and 404'd extensionless pretty URLs.
#
# Build runs `php website/bin/static-export.php`, which renders public
# routes (including the sitemap keyword matrix) to HTML under `dist/`
# (also written as `.php` filenames so splat rewrites match the pretty-URL
# contract). See docs/NETLIFY-MIGRATE.md.
#
# Production branch is `main`. GitHub Actions
# (`.github/workflows/netlify-deploy.yml`) must deploy `--dir=dist`
# after the same export. See DEPLOY.md.
#
# `ignore = "false"` means never skip a build — empty-diff heuristics
# must not block production after a merge.

[build]
  command = "php website/bin/static-export.php --keyword-towns=priority && php website/bin/check-static-export.php"
  publish = "dist"
  ignore = "false"

[build.environment]
  PHP_VERSION = "8.3"
  SITE_URL = "https://icomplypropertyservices.co.uk"

[context.production]
  command = "php website/bin/static-export.php --keyword-towns=priority && php website/bin/check-static-export.php"
  publish = "dist"

# Re-apply the curated sitemap after other build plugins. A file-crawl plugin
# (live /sitemaps/sitemap-1.xml … sitemap-6.xml) must not be the last writer.
[[plugins]]
  package = "./netlify/plugins/lock-sitemap"

[[redirects]]
  from = "https://www.icomplypropertyservices.co.uk/*"
  to = "https://icomplypropertyservices.co.uk/:splat"
  status = 301
  force = true

