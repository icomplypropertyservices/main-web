# Powered by Netlify badge: Netlify injects /.netlify/scripts/hud at the edge
# (Project configuration → General → Powered by Netlify badge). That toggle
# is not in git. This policy allows inline scripts and same-site /assets/
# only, so the HUD script cannot execute on the next deploy.
# Keep this path-scoped. Adding 'self' would allow the badge back.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "script-src 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://icomplypropertyservices.co.uk/assets/ https://www.icomplypropertyservices.co.uk/assets/ https://*.netlify.app/assets/"

# Renewal logger + vCard (also emitted by static-export into dist/_headers)
[[headers]]
  for = "/renewals"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/renewals/thanks"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/contact/*.vcf"
  [headers.values]
    Content-Type = "text/x-vcard"
    Content-Disposition = "inline; filename=\"iComply-Property-Services.vcf\""
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=86400"

# GSC 404s (2026-10-15): retired product/shop URLs Google still requests.
# Not forced, so any exported product file still wins.
[[redirects]]
  from = "/products/product/*"
  to = "/products"
  status = 301

[[redirects]]
  from = "/products/brand/*"
  to = "/products"
  status = 301

[[redirects]]
  from = "/products/keywords/*"
  to = "/products"
  status = 301

[[redirects]]
  from = "/shop/products/*"
  to = "/shop"
  status = 301

# battery-storage hub was retired to /pages/services (426 GSC impressions, 0 clicks).
# Send it to the live battery storage page instead.
[[redirects]]
  from = "/pages/services/battery-storage"
  to = "/pages/keywords/battery-storage-electrical"
  status = 301
  force = true

# GSC 21 Oct: retired slug (banned wording) -> its live replacement, one hop.
# Town URLs follow it in one hop too (town-matrix reads the hub's 301).
[[redirects]]
  from = "/pages/keywords/extension-fixed-price-package"
  to = "/pages/keywords/extension-building-package-quote"
  status = 301
  force = true
