# Netlify scaffold for iComply main-web
#
# IMPORTANT (scaffold only):
# Publishing raw `website/` does NOT execute PHP at request time.
# Netlify serves static files only. Dynamic PHP pages will not run until
# a build-time static exporter ships (P1+) and publish points at `dist`.
# This file enables smoke deploys of existing static assets under website/.

[build]
  command = "# P0: placeholder until static exporter ships; publish existing website static assets for smoke deploy"
  publish = "website"
  # Real build will become: php bin/static-export.php && publish = dist

[build.environment]
  PHP_VERSION = "8.3"

[[redirects]]
  from = "https://www.icomplypropertyservices.co.uk/*"
  to = "https://icomplypropertyservices.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/shop"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/shop/*"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/products"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/products/*"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/terms-and-conditions/"
  to = "/terms"
  status = 301

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
