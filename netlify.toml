# iComply main-web — PHP / static site (not Next.js, not Node)
#
# Publish directory is `website/` (the real site tree: pages, assets,
# manifest.json, robots, sitemap). There is no npm/Next.js build.
#
# Production branch is `main`. Every push to main is deployed by
# `.github/workflows/netlify-deploy.yml` (NETLIFY_AUTH_TOKEN +
# NETLIFY_SITE_ID). See DEPLOY.md.
#
# `ignore = "false"` means never skip a build — empty-diff heuristics
# must not block production after a merge (the PR #1 failure mode).

[build]
  command = "test -f website/manifest.json && test -f website/pages/areas.php && test -d website/assets && echo 'Publish website/ (PHP/static; no Node/Next.js build)'"
  publish = "website"
  ignore = "false"

[build.environment]
  PHP_VERSION = "8.3"

[context.production]
  command = "test -f website/manifest.json && test -f website/pages/areas.php && test -d website/assets && echo 'Production publish website/ from main'"
  publish = "website"

[[redirects]]
  from = "https://www.icomplypropertyservices.co.uk/*"
  to = "https://icomplypropertyservices.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/shop"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/shop/*"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/products"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/products/*"
  to = "/pages/packages"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/terms-and-conditions/"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/pages/about"
  status = 301

[[redirects]]
  from = "/about-us/"
  to = "/pages/about"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/contact-us/"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/cookie-policy"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/cookie-policy/"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/pages/resources"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/pages/resources"
  status = 301

[[redirects]]
  from = "/news"
  to = "/pages/resources"
  status = 301

[[redirects]]
  from = "/news/"
  to = "/pages/resources"
  status = 301

[[redirects]]
  from = "/sitemap-*.xml"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/assets/images/services/*-photo.jpg"
  to = "/assets/images/services/:splat.jpg"
  status = 200

[[redirects]]
  from = "/assets/images/manufacturers/*"
  to = "/assets/images/services/fire-alarms.jpg"
  status = 200

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
