# AOV and Barriers × town (pop > 10k) are real exports stored as .php.
# 200, no force. These must never 301. An exported file at the path wins;
# otherwise the .php sibling is served:
#   /pages/aov/{town}
#   /pages/barriers/{town}
#   /pages/services/aov/{town}
#   /pages/services/aov-air-handling/{town}
#   /pages/services/barriers/{town}
#   /pages/aov-air-handling/{town}
