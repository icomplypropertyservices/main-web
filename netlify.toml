# Powered by Netlify badge: Netlify injects /.netlify/scripts/hud at the edge
# (Project configuration → General → Powered by Netlify badge). That toggle
# is not in git. This policy allows inline scripts and same-site /assets/
# only, so the HUD script cannot execute on the next deploy.
# Keep this path-scoped. Adding 'self' would allow the badge back.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "script-src 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://icomplypropertyservices.co.uk/assets/ https://www.icomplypropertyservices.co.uk/assets/ https://*.netlify.app/assets/"

# Renewal logger + vCard (also emitted by static-export into dist/_headers)
[[headers]]
  for = "/renewals"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/renewals/thanks"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/contact/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=86400"

