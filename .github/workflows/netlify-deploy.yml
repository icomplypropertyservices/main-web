# Deploy iComply main-web to Netlify on every push to main.
# Official CLI action: https://github.com/netlify/actions
#
# Jack must add these GitHub Actions secrets once (never commit them):
#   NETLIFY_AUTH_TOKEN  — Netlify personal access token
#   NETLIFY_SITE_ID     — Project ID for site icomply-main-web
# See DEPLOY.md.
#
# PHP does not run at request time on Netlify. This workflow pre-renders
# website/ → dist/ then publishes dist/ (pretty URLs + HTML, not PHP source).

name: Deploy to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Production deploy (main)
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set. Add it in GitHub → Settings → Secrets and variables → Actions. See DEPLOY.md."
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is not set. Add it in GitHub → Settings → Secrets and variables → Actions. See DEPLOY.md."
            missing=1
          fi
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Verify source tree (website/)
        run: |
          set -e
          test -f website/manifest.json
          test -f website/pages/areas.php
          test -f website/pages/services.php
          test -f website/pages/resources.php
          test -d website/assets
          test -f website/bin/static-export.php
          echo "website/ OK — will pre-render to dist/"

      - name: Static export (PHP → HTML in dist/)
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/static-export.php --keyword-towns=priority
        timeout-minutes: 180

      - name: Verify dist/ pretty URLs
        run: php website/bin/check-static-export.php

      # Do not use netlify/actions/cli (node:22-alpine). Edge bundling downloads
      # a glibc Deno binary, Alpine cannot run it, and the action ignores the
      # CLI exit code, so a green job can mean the upload never happened.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Netlify CLI
        run: npm install --prefix "$RUNNER_TEMP/netlify" netlify-cli@27.10.2

      - name: Deploy dist/ to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CI: "true"
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/netlify/node_modules/.bin/netlify" deploy --dir=dist --prod --no-build --message "github.com/${{ github.repository }}@${{ github.sha }}" | tee /tmp/netlify-prod.txt
          if grep -q "Deploy aborted" /tmp/netlify-prod.txt; then
            echo "::error::Netlify aborted the production deploy."
            exit 1
          fi
          if ! grep -q "Production URL:" /tmp/netlify-prod.txt; then
            echo "::error::No production URL in the Netlify output."
            exit 1
          fi

      # Queue a Netlify-side build of main as well. Does not rely on the
      # GitHub↔Netlify webhook (the path that missed PR #1). That build
      # also runs php website/bin/static-export.php (see netlify.toml).
      - name: Queue Netlify production rebuild of main
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds" \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"clear_cache":true}'
          echo
          echo "Queued Netlify build for site"
