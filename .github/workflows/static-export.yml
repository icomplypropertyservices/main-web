# Verify Netlify static pre-render on pull requests.
# Does not deploy and does not need Netlify secrets.

name: Static export check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Pre-render website/ → dist/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Static export
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/static-export.php
        timeout-minutes: 20

      - name: Check pretty-URL HTML
        run: php website/bin/check-static-export.php
