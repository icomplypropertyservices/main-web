# Verify Netlify static pre-render on pull requests.
# Does not deploy and does not need Netlify secrets.

name: Static export check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Pre-render website/ → dist/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: SEO matrix + sitemap hygiene
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/check-seo-matrix.php && php website/bin/check-sitemap.php && php website/bin/test-electrical-gas-matrix.php && php website/bin/check-seo-ia-wave1.php && php website/bin/check-building-fabric.php && php website/bin/check-job-types-master.php

      - name: Static export
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/static-export.php
        timeout-minutes: 90

      - name: Pack Netlify dist for Ellie (PR #11 draft alias)
        if: always() && hashFiles('dist/index.html') != ''
        run: |
          tar -czf pr-11-netlify-dist.tar.gz dist
          sha256sum pr-11-netlify-dist.tar.gz | tee pr-11-netlify-dist.tar.gz.sha256
          echo "keyword hubs: $(tar -tzf pr-11-netlify-dist.tar.gz | grep -E 'pages/keywords/[^/]+\.php$' | wc -l)"

      - name: Upload pr-11-netlify-dist artifact
        if: always() && hashFiles('pr-11-netlify-dist.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pr-11-netlify-dist
          path: |
            pr-11-netlify-dist.tar.gz
            pr-11-netlify-dist.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Check pretty-URL HTML
        run: php website/bin/check-static-export.php && php website/bin/check-job-types-master.php --dist=dist --require-dist --skip-render
