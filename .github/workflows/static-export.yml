# Verify Netlify static pre-render on pull requests.
# Does not deploy and does not need Netlify secrets.

name: Static export check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Pre-render website/ → dist/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          df -h
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: SEO matrix + sitemap hygiene
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/check-seo-matrix.php && php website/bin/check-sitemap.php && php website/bin/test-electrical-gas-matrix.php && php website/bin/test-area-hubs-mcr-burnley.php && php website/bin/check-open-job-lanes.php

      - name: Static export
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/static-export.php --keyword-towns=priority
        timeout-minutes: 180

      - name: Check pretty-URL HTML
        run: php website/bin/check-static-export.php
