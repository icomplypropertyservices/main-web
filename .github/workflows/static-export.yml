# Verify Netlify static pre-render on pull requests.
# Does not deploy and does not need Netlify secrets.

name: Static export check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Pre-render website/ → dist/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          df -h
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: SEO matrix + sitemap hygiene
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/check-seo-matrix.php && php website/bin/check-sitemap.php && php website/bin/test-electrical-gas-matrix.php && php website/bin/test-area-hubs-mcr-burnley.php && php website/bin/check-open-job-lanes.php && php website/bin/check-manchester-electrical-p0.php && node website/bin/check-manchester-electrical-p0.mjs

      - name: Town matrix page uniqueness
        run: node website/bin/check-matrix-pages.mjs

      - name: Nationwide 3-line P0 keywords
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/check-nationwide-3line-p0.php && node website/bin/check-nationwide-3line-p0.mjs

      - name: AOV + Barriers DEEP P0 (manual + width/height)
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/check-aov-barriers-deep.php --sample=12 && node website/bin/check-aov-barriers-deep.mjs

      - name: Fire alarm installer family
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/check-fire-alarm-installer.php && node website/bin/check-fire-alarm-installer-xtown.mjs

      - name: Margin DEEP packs
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/check-margin-deep.php --sample=12 && node website/bin/check-margin-deep.mjs && python3 website/bin/check-margin-deep-sim.py

      - name: Static export
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/static-export.php --keyword-towns=none && node website/bin/apply-seo-basics.mjs dist && python3 website/bin/unlink-dead-internal.py dist && python3 website/bin/dedupe-h1-meta.py dist && python3 website/bin/family-images.py dist
        timeout-minutes: 180

      - name: Check pretty-URL HTML
        run: php website/bin/check-static-export.php

      - name: Sitemap never shrinks (>= 22 Oct baseline 1,093,075 URLs, shards <= 50k)
        run: php website/bin/check-sitemap-no-shrink.php --dist=dist && php website/bin/check-sitemap-no-prune.php --dist=dist

      - name: Thin x town internal links (CLOSE-Q8)
        run: node website/bin/check-town-interlinks.mjs dist

      - name: Thin x town prose words + uniqueness (CLOSE-Q1)
        run: node website/bin/render-town-sample.mjs dist /tmp/town-sample && python3 website/bin/check-town-words.py /tmp/town-sample && python3 website/bin/check-town-price-gas.py /tmp/town-sample

      - name: Service pages use only their own service photos
        run: node website/bin/check-service-images.mjs dist

      - name: Money-page CTR briefs C1-C15 (titles, metas, depth, links, robots, canonical, sitemap)
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: node website/bin/check-money-ctr.mjs dist

      - name: GSC 21 Oct upgrade queue (titles <=60, metas 140-155, >=800 words, >=80 links)
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
          MONEY_CTR_DATA: website/data/gsc-upgrade-2026-10-21.json
        run: node website/bin/check-money-ctr.mjs dist

      - name: GSC rankings 22 Oct queue (keyword-first titles/metas, CTA under H1, FAQ+Service, >=800 words, >=80 links, hub inbound links)
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: node website/bin/render-rank-pages.mjs dist /tmp/rank-render && python3 website/bin/check-rank-upgrade.py /tmp/rank-render

      - name: Service photos unique per service (perceptual hash, catches renamed duplicates)
        run: pip install -q opencv-python-headless numpy pillow && python3 website/bin/check-service-photo-dupes.py && python3 website/bin/check-photo-visual-dupes.py

      - name: SEO basics (JSON-LD FAQ/Service valid, images exist, no noindex)
        run: python3 website/bin/check-seo-basics.py dist --strict

      - name: Every redirect is one hop to a 200
        run: node website/bin/check-redirect-hops.mjs dist

      - name: W1a nationwide job hubs (words, self-canonical, uniqueness)
        run: php website/bin/check-nationwide-p0-jobs.php && python3 website/bin/check-w1a-hub-uniqueness.py dist

      - name: Site-wide banned phrases + barrier census copy
        run: python3 website/bin/check-barriers-copy.py dist && python3 website/bin/check-only-gmail.py dist

      - name: Every img and og:image on exported pages exists
        run: python3 website/bin/check-images-exist.py dist

      - name: Networking, data cabling and mesh Wi-Fi pack (words, similarity, links, schema, photos, sitemap)
        run: python3 website/bin/check-network-pack.py dist

      - name: Fire-family service x town depth (>=800 words, sample similarity <=0.70)
        run: python3 website/bin/check-fire-family-depth.py dist

      - name: No 'keyword guide' wording anywhere in the build
        run: python3 website/bin/check-keyword-guide-wording.py dist

      - name: Security keyword x town words + uniqueness (SEO PR145, 15 intents x 20 towns)
        run: |
          TOWN_SAMPLE_ONLY=security node website/bin/render-town-sample.mjs dist /tmp/town-sample
          python3 website/bin/check-town-words.py /tmp/town-sample

      - name: Batch 1 Manchester building pages (hero call CTA, titles, meta, photos, links, similarity)
        run: node website/bin/render-batch1.mjs /tmp/batch1 && python3 website/bin/check-batch1.py /tmp/batch1 dist && python3 website/bin/check-images-exist.py /tmp/batch1
