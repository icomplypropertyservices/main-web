# Draft Netlify URL for the combined finish branch. Never production.
# Same export and CLI as Deploy to Netlify, without --prod and without
# POST /sites/{id}/builds (that queues a production build).

name: Draft preview (finish branch)

on:
  push:
    branches:
      - cursor/finish-property-site-5e45
  workflow_dispatch:

concurrency:
  group: netlify-draft-finish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  draft:
    name: Netlify draft deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set. Draft was not created. Production was not deployed."
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is not set. Draft was not created. Production was not deployed."
            missing=1
          fi
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Static export (PHP → HTML in dist/)
        env:
          SITE_URL: https://icomplypropertyservices.co.uk
        run: php website/bin/static-export.php --keyword-towns=priority
        timeout-minutes: 180

      - name: Verify dist/ pretty URLs
        run: php website/bin/check-static-export.php

      # netlify/actions/cli@master is node:22-alpine. With --no-build the CLI
      # bundles netlify/edge-functions before upload. @netlify/edge-bundler
      # downloads Deno as x86_64-unknown-linux-gnu, which Alpine cannot execute,
      # then the CLI prints only "Deploy aborted due to error while bundling
      # edge functions" and the action still exits 0. Run the CLI on this
      # ubuntu-latest runner (glibc) and require a draft URL in the log.
      # Never --prod, and never POST /sites/{id}/builds (that publishes).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Netlify CLI
        run: npm install --prefix "$RUNNER_TEMP/netlify" netlify-cli@27.10.2

      - name: Bundle edge functions before upload
        env:
          NF_ROOT: ${{ runner.temp }}/netlify
        run: |
          set -euo pipefail
          deno --version
          node --input-type=module <<'JS'
          import { mkdtemp, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const root = process.env.NF_ROOT;
          const { bundle } = await import(join(root, 'node_modules/@netlify/edge-bundler/dist/node/index.js'));
          const dist = await mkdtemp(join(tmpdir(), 'edge-'));
          try {
            const result = await bundle(['netlify/edge-functions'], dist, [], {
              basePath: process.cwd(),
              debug: true,
              featureFlags: {},
              systemLogger: (...args) => console.log('[edge]', ...args),
              userLogger: (...args) => console.log('[edge]', ...args),
            });
            const routes = result?.manifest?.routes ?? [];
            console.log('Edge bundle ok. Routes:', JSON.stringify(routes));
            if (!routes.some((route) => route.path === '/robots.txt')) {
              console.error('Edge bundle did not route /robots.txt');
              process.exit(1);
            }
          } catch (error) {
            console.error('Edge function bundle failed');
            console.error(error);
            process.exit(1);
          } finally {
            await rm(dist, { recursive: true, force: true });
          }
          JS

      - name: Deploy draft (never production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CI: "true"
        run: |
          set -euo pipefail
          netlify="${RUNNER_TEMP}/netlify/node_modules/.bin/netlify"
          args=(deploy --dir=dist --alias finish-property-site --no-build --message "finish-property-site draft, not production")
          for arg in "${args[@]}"; do
            if [ "$arg" = "--prod" ]; then
              echo "::error::Refusing to pass --prod"
              exit 1
            fi
          done
          "$netlify" "${args[@]}" | tee /tmp/netlify-draft.txt
          if grep -q "Deploy aborted" /tmp/netlify-draft.txt; then
            echo "::error::Netlify aborted the draft deploy. Production was not published."
            exit 1
          fi
          if ! grep -E "Draft URL:|Website Draft URL:|draft URL" /tmp/netlify-draft.txt; then
            echo "::error::No draft URL in the Netlify output. Production was not published."
            exit 1
          fi
          if grep -E "icomplypropertyservices.co.uk" /tmp/netlify-draft.txt | grep -v netlify.app | grep -q "Production URL"; then
            echo "::error::Output includes a production URL. Stop."
            exit 1
          fi
