<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Lead popup form (Netlify registration)</title>
  <meta name="description" content="Send iComply Property Services your enquiry and we will call you back about your property, the work you need and a date. Free quote, call 07517 806082">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://icomplypropertyservices.co.uk/lead-popup-form.html">
</head>
<body>
  <h1>Send Us Your Enquiry</h1>
  <!-- Netlify parses this file at deploy so form lead-popup is registered even if JS fails. -->
  <form name="lead-popup" method="POST" action="/thank-you" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="lead-popup">
    <input name="bot-field">
    <input name="name">
    <input name="email">
    <input name="phone">
    <input name="service">
    <textarea name="message"></textarea>
    <input name="source" value="lead-popup">
  </form>
</body>
</html>
