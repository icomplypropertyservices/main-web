<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Onboarding form (Netlify registration)</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://icomplypropertyservices.co.uk/subcontractor-onboarding-form.html">
</head>
<body>
  <!-- Netlify parses .html at deploy. Pages are published as .php, so this file registers the form. -->
  <form name="subcontractor-onboarding" method="POST" action="/thank-you" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" class="bg-white border border-zinc-200 rounded-3xl p-6 md:p-8 space-y-5 shadow-sm">
  <input type="hidden" name="form-name" value="subcontractor-onboarding">
  <p hidden>
    <label>Leave this field blank <input name="bot-field" tabindex="-1" autocomplete="off"></label>
  </p>
  <div>
    <label for="sub-name" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Name</label>
    <input id="sub-name" name="name" type="text" required maxlength="120" autocomplete="name" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]">
  </div>
  <fieldset class="space-y-2">
    <legend class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Business type</legend>
    <label class="flex items-center gap-3 text-sm text-zinc-800"><input type="radio" name="business_type" value="company" required class="accent-[#ff6b00]"> Company</label>
    <label class="flex items-center gap-3 text-sm text-zinc-800"><input type="radio" name="business_type" value="sole_trader" required class="accent-[#ff6b00]"> Sole trader</label>
  </fieldset>
  <div>
    <label for="sub-company" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Company name</label>
    <input id="sub-company" name="company_name" type="text" maxlength="160" autocomplete="organization" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]">
  </div>
  <fieldset class="space-y-2">
    <legend class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Trades</legend>
    <p class="text-sm text-zinc-600">Select every trade you can carry out.</p>
    <div class="grid sm:grid-cols-2 gap-2"><label class="flex items-start gap-3 text-sm text-zinc-800"><input type="checkbox" name="trades" value="Electrical / EICR" class="mt-1 accent-[#ff6b00]"><span>Electrical / EICR</span></label><label class="flex items-start gap-3 text-sm text-zinc-800"><input type="checkbox" name="trades" value="Fire alarms" class="mt-1 accent-[#ff6b00]"><span>Fire alarms</span></label><label class="flex items-start gap-3 text-sm text-zinc-800"><input type="checkbox" name="trades" value="Emergency lighting" class="mt-1 accent-[#ff6b00]"><span>Emergency lighting</span></label><label class="flex items-start gap-3 text-sm text-zinc-800"><input type="checkbox" name="trades" value="AOV smoke vents" class="mt-1 accent-[#ff6b00]"><span>AOV smoke vents</span></label><label class="flex items-start gap-3 text-sm text-zinc-800"><input type="checkbox" name="trades" value="CCTV / access control" class="mt-1 accent-[#ff6b00]"><span>CCTV / access control</span></label><label class="flex items-start gap-3 text-sm text-zinc-800"><input type="checkbox" name="trades" value="Nurse call" class="mt-1 accent-[#ff6b00]"><span>Nurse call</span></label><label class="flex items-start gap-3 text-sm text-zinc-800"><input type="checkbox" name="trades" value="General maintenance" class="mt-1 accent-[#ff6b00]"><span>General maintenance</span></label></div>
  </fieldset>
  <div>
    <label for="sub-quals" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Qualifications</label>
    <textarea id="sub-quals" name="qualifications" rows="4" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]" placeholder="Qualifications and cards, for example 18th Edition, ECS/CSCS, FIA"></textarea>
  </div>
  <fieldset class="space-y-2">
    <legend class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Public liability insurance</legend>
    <label class="flex items-center gap-3 text-sm text-zinc-800"><input type="radio" name="insured" value="yes" required class="accent-[#ff6b00]"> Yes</label>
    <label class="flex items-center gap-3 text-sm text-zinc-800"><input type="radio" name="insured" value="no" required class="accent-[#ff6b00]"> No</label>
  </fieldset>
  <div>
    <label for="sub-expiry" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Insurance expiry</label>
    <input id="sub-expiry" name="insurance_expiry" type="date" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]">
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="sub-postcodes" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Coverage postcodes</label>
      <input id="sub-postcodes" name="coverage_postcodes" type="text" maxlength="240" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]">
    </div>
    <div>
      <label for="sub-radius" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Travel radius (miles)</label>
      <input id="sub-radius" name="travel_radius" type="number" min="0" max="500" inputmode="numeric" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]">
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="sub-phone" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Phone</label>
      <input id="sub-phone" name="phone" type="tel" required maxlength="40" autocomplete="tel" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]">
    </div>
    <div>
      <label for="sub-email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Email</label>
      <input id="sub-email" name="email" type="email" required maxlength="160" autocomplete="email" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]">
    </div>
  </div>
  <div>
    <label for="sub-availability" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Availability</label>
    <textarea id="sub-availability" name="availability" rows="3" class="w-full border border-zinc-200 px-5 py-3.5 rounded-2xl bg-white focus:outline-none focus:border-[#ff6b00] focus:ring-1 focus:ring-[#ff6b00]" placeholder="Days or areas you can cover"></textarea>
  </div>
  <div>
    <label for="sub-docs" class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Documents (optional)</label>
    <input id="sub-docs" name="documents" type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" class="block w-full text-sm text-zinc-700">
    <p class="mt-2 text-xs text-zinc-500">Optional. PDF, JPG or PNG. Maximum 8MB.</p>
  </div>
  <label class="flex items-start gap-3 text-sm text-zinc-800">
    <input type="checkbox" name="gdpr_consent" value="yes" required class="mt-1 accent-[#ff6b00]">
    <span>I agree that iComply Property Services may use these details and any uploaded documents to vet this application and assign work. See the <a href="https://icomplypropertyservices.co.uk/privacy" class="text-[#ff6b00] underline">privacy notice</a>.</span>
  </label>
  <button type="submit" class="w-full bg-[#ff6b00] hover:bg-orange-600 text-white py-4 text-lg font-semibold rounded-2xl">Submit application</button>
</form>
</body>
</html>
